site_name: Vettor
site_description: Autonomous web QA agent harness designed for deterministic replay, zero-egress privacy, and instant self-healing.
site_url: https://vettor-ai.github.io/vettor/
repo_url: https://github.com/vettor-ai/vettor
repo_name: vettor-ai/vettor

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.keys
  - tables
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Providers & Models: providers.md
  - Architecture: architecture.md
  - Terminal UI: tui.md
  - Configuration: configuration.md
