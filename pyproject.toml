[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vettor"
version = "0.3.0"
description = "Model-agnostic autonomous Web QA harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.30",
    "playwright>=1.45",
    "textual>=0.70",
    "rich>=13.7",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
vettor = "vettor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vettor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vettor"]

